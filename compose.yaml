services:
  tg-mcp-spy:
    build: .
    image: tg-mcp-spy:latest
    # container_name не задаём — имя формируется из project-name (см. run.sh),
    # чтобы можно было поднять несколько экземпляров на разных портах.
    ports:
      # Хост-порт 8090 (или другой, см. run.sh). Контейнер всегда на 8000.
      - "${HOST_PORT:-8090}:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DB_PATH: "/app/data/telegram_cache.db"
      RSSHUB_BASE_URL: "${RSSHUB_BASE_URL:-https://rsshub.app}"
    volumes:
      # База данных хранится на хосте, чтобы не теряться между перезапусками
      - ${DATA_DIR:-./data}:/app/data
    restart: unless-stopped
