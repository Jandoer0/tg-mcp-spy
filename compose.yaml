# Локальный запуск через podman compose (порт 8090).
# Образ собирается на GitHub (.github/workflows/build.yml) и публикуется
# в GHCR — здесь он просто подтягивается готовым (без локальной сборки).
services:
  tg-mcp-spy:
    image: ghcr.io/jandoer0/tg-mcp-spy:latest
    container_name: tg-mcp-spy
    ports:
      - "8090:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DB_PATH: /app/data/telegram_cache.db
      RSSHUB_BASE_URL: https://rsshub.app
    volumes:
      - ./data:/app/data:Z
