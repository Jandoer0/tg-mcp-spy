[project]
name = "tg-mcp-spy"
version = "0.2.0"
description = "MCP-сервер для отслеживания Telegram-каналов и RSS/RSSHub лент с веб-интерфейсом"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27.2",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
